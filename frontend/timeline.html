<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas - Clínica Dental</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* ... (todo el CSS se mantiene igual) ... */
    </style>
</head>
<body>
    <!-- ... (todo el HTML se mantiene igual) ... -->

    <script>
        const API_BASE_URL = 'https://dental-clinic-app-production.up.railway.app/api';

        // Verificar autenticación
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (!token) {
                window.location.href = 'index.html';
                return;
            }
            
            if (user) {
                const userData = JSON.parse(user);
                document.getElementById('user-name').textContent = userData.nombre || 'Usuario';
            }
        }

        // Cargar citas desde la API - CORREGIDO
        async function loadAppointments() {
            const token = localStorage.getItem('token');
            const loadingButton = document.getElementById('add-appointment-btn');
            const originalText = loadingButton.innerHTML;
            
            // Mostrar loading
            loadingButton.innerHTML = '<div class="loading"></div> Cargando...';
            loadingButton.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/citas`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Response status:', response.status); // Para debug
                
                if (!response.ok) {
                    // Si la respuesta no es exitosa, intentamos obtener más información del error
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    
                    if (response.status === 401) {
                        throw new Error('No autorizado. Token inválido o expirado.');
                    } else if (response.status === 404) {
                        throw new Error('Endpoint no encontrado. Verifique la URL.');
                    } else {
                        throw new Error(`Error ${response.status}: ${errorText || 'Error al cargar las citas'}`);
                    }
                }

                const appointments = await response.json();
                console.log('Citas cargadas:', appointments); // Para debug
                
                displayAppointments(appointments);
                
            } catch (error) {
                console.error('Error completo:', error);
                showMessage('Error: ' + error.message, 'error');
                
                // Si es error de autorización, redirigir al login
                if (error.message.includes('No autorizado') || error.message.includes('401')) {
                    setTimeout(() => {
                        logout();
                    }, 2000);
                }
            } finally {
                // Restaurar botón
                loadingButton.innerHTML = originalText;
                loadingButton.disabled = false;
            }
        }

        // Mostrar citas en la tabla - MEJORADO
        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointments-body');
            tbody.innerHTML = '';

            // Verificar si appointments es un array
            if (!Array.isArray(appointments)) {
                console.error('appointments no es un array:', appointments);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--brand-danger);">Error: Formato de datos incorrecto</td></tr>';
                return;
            }

            if (appointments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No hay citas registradas</td></tr>';
                return;
            }

            appointments.forEach(appointment => {
                const row = document.createElement('tr');
                
                // Formatear fecha y hora - MÁS ROBUSTO
                let formattedDate = '--/--/----';
                let formattedTime = '--:--';
                
                try {
                    if (appointment.fecha) {
                        const date = new Date(appointment.fecha);
                        if (!isNaN(date.getTime())) {
                            formattedDate = date.toLocaleDateString('es-ES');
                        }
                    }
                    
                    if (appointment.hora) {
                        formattedTime = appointment.hora;
                    }
                } catch (dateError) {
                    console.error('Error formateando fecha:', dateError);
                }
                
                // Determinar clase de estado - MÁS ROBUSTO
                let statusClass = 'status-pending';
                let statusText = 'Pendiente';
                
                if (appointment.estado === 'confirmed' || appointment.estado === 'confirmada') {
                    statusClass = 'status-confirmed';
                    statusText = 'Confirmada';
                } else if (appointment.estado === 'cancelled' || appointment.estado === 'cancelada') {
                    statusClass = 'status-cancelled';
                    statusText = 'Cancelada';
                }
                
                row.innerHTML = `
                    <td>${appointment.id || 'N/A'}</td>
                    <td>${appointment.paciente || appointment.nombrePaciente || 'N/A'}</td>
                    <td>${formattedDate}</td>
                    <td>${formattedTime}</td>
                    <td>${appointment.medico || appointment.doctor || 'N/A'}</td>
                    <td><span class="status ${statusClass}">${statusText}</span></td>
                    <td>
                        <button class="action-btn edit-btn" data-id="${appointment.id}">
                            <i class="ri-edit-line"></i>
                        </button>
                        <button class="action-btn delete-btn" data-id="${appointment.id}">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                    </td>
                `;
                
                tbody.appendChild(row);
            });

            // Agregar event listeners a los botones de editar y eliminar
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => editAppointment(btn.dataset.id));
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteAppointment(btn.dataset.id));
            });
        }

        // Mostrar mensajes - MEJORADO
        function showMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `
                ${type === 'error' ? '<i class="ri-error-warning-line"></i>' : '<i class="ri-checkbox-circle-line"></i>'}
                ${message}
            `;
            
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                if (messageContainer.contains(messageDiv)) {
                    messageContainer.removeChild(messageDiv);
                }
            }, 5000);
        }

        // Abrir modal para nueva cita
        function openNewAppointmentModal() {
            document.getElementById('modal-title').textContent = 'Nueva Cita';
            document.getElementById('appointment-form').reset();
            document.getElementById('appointment-id').value = '';
            document.getElementById('appointment-modal').style.display = 'flex';
        }

        // Editar cita - MEJORADO
        async function editAppointment(id) {
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/citas/${id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Error al cargar la cita');
                }

                const appointment = await response.json();
                
                // Llenar el formulario con los datos de la cita
                document.getElementById('modal-title').textContent = 'Editar Cita';
                document.getElementById('appointment-id').value = appointment.id;
                document.getElementById('patient-name').value = appointment.paciente || appointment.nombrePaciente || '';
                
                // Formatear fecha para el input date - MÁS ROBUSTO
                if (appointment.fecha) {
                    try {
                        const date = new Date(appointment.fecha);
                        if (!isNaN(date.getTime())) {
                            const formattedDate = date.toISOString().split('T')[0];
                            document.getElementById('appointment-date').value = formattedDate;
                        }
                    } catch (dateError) {
                        console.error('Error formateando fecha:', dateError);
                    }
                }
                
                document.getElementById('appointment-time').value = appointment.hora || '';
                document.getElementById('doctor').value = appointment.medico || appointment.doctor || '';
                document.getElementById('status').value = appointment.estado || 'pending';
                
                document.getElementById('appointment-modal').style.display = 'flex';
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Eliminar cita - MEJORADO
        async function deleteAppointment(id) {
            if (!confirm('¿Está seguro de que desea eliminar esta cita?')) {
                return;
            }
            
            const token = localStorage.getItem('token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/citas/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Error al eliminar la cita');
                }

                showMessage('Cita eliminada correctamente', 'success');
                loadAppointments(); // Recargar la lista
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Guardar cita (crear o actualizar) - MEJORADO
        async function saveAppointment(e) {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            const appointmentId = document.getElementById('appointment-id').value;
            const isEditing = !!appointmentId;
            const saveButton = document.getElementById('save-btn');
            const originalText = saveButton.innerHTML;
            
            // Mostrar loading
            saveButton.innerHTML = '<div class="loading"></div> Guardando...';
            saveButton.disabled = true;
            
            const appointmentData = {
                paciente: document.getElementById('patient-name').value,
                fecha: document.getElementById('appointment-date').value,
                hora: document.getElementById('appointment-time').value,
                medico: document.getElementById('doctor').value,
                estado: document.getElementById('status').value
            };
            
            try {
                const url = isEditing ? 
                    `${API_BASE_URL}/citas/${appointmentId}` : 
                    `${API_BASE_URL}/citas`;
                
                const method = isEditing ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(appointmentData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error al ${isEditing ? 'actualizar' : 'crear'} la cita: ${errorText}`);
                }

                const result = await response.json();
                
                showMessage(`Cita ${isEditing ? 'actualizada' : 'creada'} correctamente`, 'success');
                document.getElementById('appointment-modal').style.display = 'none';
                loadAppointments(); // Recargar la lista
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                // Restaurar botón
                saveButton.innerHTML = originalText;
                saveButton.disabled = false;
            }
        }

        // Cerrar sesión
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Inicialización - MEJORADA
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            
            // Cargar citas después de un breve delay para asegurar que la autenticación esté verificada
            setTimeout(() => {
                loadAppointments();
            }, 100);
            
            // Event listeners
            document.getElementById('add-appointment-btn').addEventListener('click', openNewAppointmentModal);
            document.getElementById('appointment-form').addEventListener('submit', saveAppointment);
            document.getElementById('close-modal').addEventListener('click', () => {
                document.getElementById('appointment-modal').style.display = 'none';
            });
            document.getElementById('cancel-btn').addEventListener('click', () => {
                document.getElementById('appointment-modal').style.display = 'none';
            });
            document.getElementById('logout-btn').addEventListener('click', logout);
            
            // Cerrar modal al hacer clic fuera del contenido
            document.getElementById('appointment-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('appointment-modal')) {
                    document.getElementById('appointment-modal').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
